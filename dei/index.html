<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>intra-student conflict · staff training</title>
  <meta name="description" content="A staff training page on intra-student conflict: nine scenarios in two tabs (PYP, MS/HS) to discuss and work through together.">

  <!-- Pre-paint theme + language (runs before first paint; no flash).
       KEEP IN SYNC with js/theme.js and js/i18n.js -->
  <script>
    (function () {
      try {
        document.documentElement.classList.add('js');
        var m = localStorage.getItem('dei-mode');
        if (m === 'presenter') document.documentElement.setAttribute('data-mode', 'presenter');
        var t = localStorage.getItem('dei-theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);

        var l = localStorage.getItem('dei-lang');
        if (l !== 'en' && l !== 'zh') l = 'en';
        document.documentElement.setAttribute('data-lang', l);
        document.documentElement.lang = (l === 'zh') ? 'zh-Hans' : 'en';
      } catch (e) { /* CSS defaults to light / English */ }
    })();
  </script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/scenarios.css">
</head>
<body>

  <header class="site-header">
    <a class="brand" href="#/pyp">dei<span class="brand-sep">/</span>training</a>

    <!-- Two tabs, one per group (plans.md section 2): PYP holds
         scenarios 1 to 4, MS/HS holds 5 to 9. Each panel is one
         long page; js/scenarios.js fills them from
         data/scenarios.js. -->
    <nav class="tabs" aria-label="Group tabs">
      <a class="tab-link is-active" data-tab="pyp" href="#/pyp"
         data-en="PYP" data-zh="PYP">PYP</a>
      <a class="tab-link" data-tab="mshs" href="#/mshs"
         data-en="MS/HS" data-zh="MS/HS">MS/HS</a>
    </nav>

    <div class="header-tools">
      <!-- Explorer badge: appears when every interactive element of
           all nine scenarios has been engaged (js/progress.js). -->
      <span class="badge" data-badge hidden
            data-en="All nine scenarios" data-zh="示例：待翻译">All nine scenarios</span>

      <button class="tool-btn" type="button" data-mode-toggle aria-pressed="false"
              aria-label="Toggle presenter mode">
        <!-- The EN/中文 pair lives on the span; js/mode.js keeps it
             in step with the mode, js/i18n.js re-applies it on switch. -->
        <span data-mode-label data-en="Presenter" data-zh="演示模式">Presenter</span>
      </button>

      <button class="tool-btn" type="button" data-lang-toggle
              aria-label="Switch to Simplified Chinese">
        <span data-lang-label>中文</span>
      </button>

      <button class="tool-btn" type="button" data-theme-toggle
              aria-pressed="false"
              data-label-light="Dark" data-label-dark="Light"
              aria-label="Switch colour theme">
        <!-- moon: shown in light mode (switches to dark) -->
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
        <!-- sun: shown in dark mode (switches to light) -->
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <span data-theme-label>Dark</span>
      </button>
    </div>
  </header>

  <!-- Step 2 (js/screens.js) fills this with one dot per data-screen. -->
  <nav class="rail" data-rail aria-label="Page position"></nav>

  <!-- Two scenario tabs, one per group (plans.md section 2).
       Each panel is one long page; js/scenarios.js renders the
       jump strip and the scenario screens into it from
       data/scenarios.js. The first panel is the no-JS default. -->
  <main>
    <div class="tab-panel is-active" data-tab-panel="pyp">
      <noscript><p class="noscript-note" data-en="Turn on JavaScript to work through the scenarios. The content lives in data/scenarios.js." data-zh="示例：待翻译">Turn on JavaScript to work through the scenarios. The content lives in data/scenarios.js.</p></noscript>
    </div>
    <div class="tab-panel" data-tab-panel="mshs">
      <noscript><p class="noscript-note" data-en="Turn on JavaScript to work through the scenarios. The content lives in data/scenarios.js." data-zh="示例：待翻译">Turn on JavaScript to work through the scenarios. The content lives in data/scenarios.js.</p></noscript>
    </div>
  </main>

  <!-- Presenter strip: prev / next and the current screen title.
       Always visible; presenter mode changes type and motion. -->
  <div class="strip" role="toolbar" aria-label="Presenter controls">
    <button class="strip-btn" type="button" data-strip-prev aria-label="Previous screen"
            data-en="Prev" data-zh="上一页">Prev</button>
    <span class="strip-title" data-strip-title></span>
    <button class="strip-btn" type="button" data-strip-next aria-label="Next screen"
            data-en="Next" data-zh="下一页">Next</button>
    <!-- Resets the explorer progress (js/progress.js). -->
    <button class="strip-btn" type="button" data-reset-progress
            data-en="Reset progress" data-zh="示例：待翻译">Reset progress</button>
  </div>

  <noscript>
    <style>[data-reveal] { opacity: 1 !important; transform: none !important; }</style>
  </noscript>

  <footer class="site-footer">
    <p>
      <span data-en="a project by mr. k, more at " data-zh="mr. k 的项目，更多内容见 ">a project by mr. k, more at </span><a href="https://contrapaul.com">contrapaul.com</a>
    </p>
  </footer>

  <!-- Plain scripts, no modules, no fetch: the page must run from
       file:// as well as any static host (brief hard requirement 5). -->
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <!-- Scenario content, then the renderer, then the progress
       tracker, then the engine. The renderer must run before
       js/screens.js so the rail builds over the real screens. -->
  <script src="data/scenarios.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/mode.js"></script>

</body>
</html>
