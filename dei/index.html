<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>intra-student conflict · staff training</title>
  <meta name="description" content="Staff training on intra-student conflict: committee scenarios for PYP and MS/HS to play through and discuss.">

  <!-- Pre-paint theme + language (runs before first paint; no flash).
       KEEP IN SYNC with js/theme.js and js/i18n.js -->
  <script>
    (function () {
      try {
        document.documentElement.classList.add('js');
        var t = localStorage.getItem('dei-theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);

        var l = localStorage.getItem('dei-lang');
        if (l !== 'en' && l !== 'zh') l = 'en';
        document.documentElement.setAttribute('data-lang', l);
        document.documentElement.lang = (l === 'zh') ? 'zh-Hans' : 'en';
      } catch (e) { /* CSS defaults to light / English */ }
    })();
  </script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/scenarios.css">
</head>
<body>

  <header class="site-header">
    <a class="brand" href="#/pyp">dei<span class="brand-sep">/</span>training</a>

    <nav class="tabs" aria-label="Group tabs">
      <a class="tab-link is-active" data-tab="pyp" href="#/pyp"
         data-en="PYP" data-zh="PYP">PYP</a>
      <a class="tab-link" data-tab="mshs" href="#/mshs"
         data-en="MS/HS" data-zh="MS/HS">MS/HS</a>
    </nav>

    <div class="header-tools">
      <!-- Trophy and awards list (js/progress.js). -->
      <span class="rewards" data-rewards></span>

      <button class="tool-btn" type="button" data-lang-toggle
              aria-label="Switch to Simplified Chinese">
        <span data-lang-label>中文</span>
      </button>

      <button class="tool-btn" type="button" data-theme-toggle
              aria-pressed="false"
              data-label-light="Dark" data-label-dark="Light"
              aria-label="Switch colour theme">
        <!-- moon: shown in light mode (switches to dark) -->
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
        <!-- sun: shown in dark mode (switches to light) -->
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <span class="tool-label" data-theme-label>Dark</span>
      </button>
    </div>
  </header>

  <!-- Two tabs, one per group: PYP holds scenarios 1 to 4, MS/HS
       holds 5 to 9. js/scenarios.js fills each panel from
       data/scenarios.js. The first panel is the no-JS default. -->
  <main>
    <!-- Instructions, visible on load on both tabs (staff request,
         2026-10-28). -->
    <p class="instructions"
       data-en="Read through the scenarios with your group, then discuss the scenario and the debrief questions."
       data-zh="请与小组一起阅读情境，然后讨论情境和复盘问题。">Read through the scenarios with your group, then discuss the scenario and the debrief questions.</p>

    <div class="tab-panel is-active" data-tab-panel="pyp">
      <noscript><p class="noscript-note" data-en="Turn on JavaScript to see the scenarios." data-zh="请开启 JavaScript 以查看情境。">Turn on JavaScript to see the scenarios.</p></noscript>
    </div>
    <div class="tab-panel" data-tab-panel="mshs">
      <noscript><p class="noscript-note" data-en="Turn on JavaScript to see the scenarios." data-zh="请开启 JavaScript 以查看情境。">Turn on JavaScript to see the scenarios.</p></noscript>
    </div>
  </main>

  <footer class="site-footer">
    <p>
      <span data-en="a project by mr. k, more at " data-zh="mr. k 的项目，更多内容见 ">a project by mr. k (and the isns deij team), more at </span><a href="https://contrapaul.com">contrapaul.com</a>
    </p>
  </footer>

  <!-- Plain scripts, no modules, no fetch: the page must run from
       file:// as well as any static host. Progress loads before the
       renderer so finished scenarios open finished; tabs run last so
       a deep link can scroll to a rendered scenario. -->
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="data/scenarios.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/tabs.js"></script>

</body>
</html>
